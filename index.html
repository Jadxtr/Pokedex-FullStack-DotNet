<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Pokédex Simples</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f0f0; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 40px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card img { width: 120px; height: 120px; background: #f9f9f9; border-radius: 50%; }
        .type { display: inline-block; padding: 5px 10px; margin: 5px; border-radius: 20px; font-size: 12px; color: white; background: #777; }
        /* Cores de exemplo */
        .grass { background: #7AC74C; } .fire { background: #EE8130; } .water { background: #6390F0; }
    </style>
</head>
<body>
    <h1>Pokédex</h1>
    <div id="pokedex" class="grid">Carregando Pokémon...</div>

    <script>
        async function fetchPokemons() {
            try {
                // Chama a SUA API que você acabou de criar
                const response = await fetch('http://localhost:5164/api/pokemon');
                const data = await response.json();
                
                const container = document.getElementById('pokedex');
                container.innerHTML = data.map(p => `
                    <div class="card">
                        <img src="${p.imageUrl}" alt="${p.name}">
                        <h3>#${p.id} ${p.name.toUpperCase()}</h3>
                        <div>${p.types.map(t => `<span class="type ${t}">${t}</span>`).join('')}</div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('pokedex').innerText = "Erro ao carregar. Verifique se a API está rodando!";
            }
        }
        fetchPokemons();
    </script>
</body>
</html>
