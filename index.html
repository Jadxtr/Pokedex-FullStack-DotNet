<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pokédex GEX - Full Stack</title>
    <style>
        :root {
            --normal: #a8a878; --fire: #f08030; --water: #6890f0; --grass: #78c850;
            --electric: #f8d030; --ice: #98d8d8; --fighting: #c03028; --poison: #a040a0;
            --ground: #e0c068; --flying: #a890f0; --psychic: #f85888; --bug: #a8b820;
            --rock: #b8a038; --ghost: #705898; --dragon: #7038f8; --dark: #705848;
            --steel: #b8b8d0; --fairy: #ee99ac;
        }

        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .header-container { text-align: center; margin-bottom: 30px; }
        
        #search-input { 
            padding: 12px 20px; width: 300px; border-radius: 25px; border: none; 
            font-size: 16px; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        .card { 
            background: #2a2a2a; border-radius: 20px; padding: 20px; text-align: center;
            transition: 0.3s; border: 3px solid transparent; cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; max-width: 140px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3)); }

        .type-badge { display: inline-block; padding: 5px 12px; border-radius: 15px; margin: 5px; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        /* Classes CSS de bordas e fundos geradas dinamicamente via variáveis */
        .border-normal { border-color: var(--normal); } .bg-normal { background: var(--normal); }
        .border-fire { border-color: var(--fire); } .bg-fire { background: var(--fire); }
        .border-water { border-color: var(--water); } .bg-water { background: var(--water); }
        .border-grass { border-color: var(--grass); } .bg-grass { background: var(--grass); }
        .border-electric { border-color: var(--electric); } .bg-electric { background: var(--electric); }
        .border-ice { border-color: var(--ice); } .bg-ice { background: var(--ice); }
        .border-fighting { border-color: var(--fighting); } .bg-fighting { background: var(--fighting); }
        .border-poison { border-color: var(--poison); } .bg-poison { background: var(--poison); }
        .border-ground { border-color: var(--ground); } .bg-ground { background: var(--ground); }
        .border-flying { border-color: var(--flying); } .bg-flying { background: var(--flying); }
        .border-psychic { border-color: var(--psychic); } .bg-psychic { background: var(--psychic); }
        .border-bug { border-color: var(--bug); } .bg-bug { background: var(--bug); }
        .border-rock { border-color: var(--rock); } .bg-rock { background: var(--rock); }
        .border-ghost { border-color: var(--ghost); } .bg-ghost { background: var(--ghost); }
        .border-dragon { border-color: var(--dragon); } .bg-dragon { background: var(--dragon); }
        .border-dark { border-color: var(--dark); } .bg-dark { background: var(--dark); }
        .border-steel { border-color: var(--steel); } .bg-steel { background: var(--steel); }
        .border-fairy { border-color: var(--fairy); } .bg-fairy { background: var(--fairy); }

        /* MODAL */
        .modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #2a2a2a; margin: 10% auto; padding: 30px; border-radius: 20px;
            width: 85%; max-width: 380px; text-align: center; border: 4px solid #444; position: relative;
        }
        .close { position: absolute; right: 20px; top: 15px; font-size: 28px; font-weight: bold; cursor: pointer; color: #888; }
        .close:hover { color: white; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Pokédex GEX</h1>
        <input type="text" id="search-input" placeholder="Pesquisar Pokémon por nome..." oninput="filtrarPokemons()">
    </div>
    
    <div id="pokedex" class="grid">Carregando Pokédex...</div>

    <div id="pokedexModal" class="modal">
        <div class="modal-content" id="modal-body">
            <span class="close" onclick="fecharModal()">&times;</span>
            <div id="detalhes-pokemon"></div>
        </div>
    </div>

    <script>
        let todosPokemons = [];

        async function carregarPokedex() {
            try {
                const response = await fetch('http://localhost:5164/api/pokemon');
                todosPokemons = await response.json();
                exibirPokemons(todosPokemons);
            } catch (err) {
                document.getElementById('pokedex').innerHTML = "Erro ao conectar com a API Backend!";
            }
        }

        function exibirPokemons(lista) {
            const container = document.getElementById('pokedex');
            if(lista.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Nenhum Pokémon encontrado.</p>";
                return;
            }
            container.innerHTML = lista.map(p => `
                <div class="card border-${p.types[0]}" onclick="mostrarDetalhes(${p.id})">
                    <img src="${p.imageUrl}" alt="${p.name}">
                    <p style="color: #888; margin: 5px 0 0 0;">#${p.id.toString().padStart(3, '0')}</p>
                    <h2 style="margin: 5px 0 10px 0; text-transform: capitalize;">${p.name}</h2>
                    <div>${p.types.map(t => `<span class="type-badge bg-${t}">${t}</span>`).join('')}</div>
                </div>
            `).join('');
        }

        function mostrarDetalhes(id) {
            const pokemon = todosPokemons.find(p => p.id === id);
            const modal = document.getElementById('pokedexModal');
            const conteudo = document.getElementById('detalhes-pokemon');

            // Converte decímetros para metros e hectogramas para quilogramas
            const alturaMetros = (pokemon.height / 10).toFixed(1);
            const pesoKg = (pokemon.weight / 10).toFixed(1);

            conteudo.innerHTML = `
                <img src="${pokemon.imageUrl}" style="width: 180px; filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.6));">
                <h1 style="text-transform: capitalize; margin: 10px 0 5px 0;">${pokemon.name}</h1>
                <p style="color: #888; margin: 0 0 20px 0;">Nº ${pokemon.id.toString().padStart(3, '0')}</p>
                
                <div style="display: flex; justify-content: space-around; background: #1f1f1f; padding: 12px; border-radius: 12px; margin-bottom: 20px;">
                    <div>
                        <span style="display: block; font-size: 0.85em; color: #777; margin-bottom: 3px;">ALTURA</span>
                        <strong style="font-size: 1.1em;">${alturaMetros} m</strong>
                    </div>
                    <div>
                        <span style="display: block; font-size: 0.85em; color: #777; margin-bottom: 3px;">PESO</span>
                        <strong style="font-size: 1.1em;">${pesoKg} kg</strong>
                    </div>
                </div>

                <div style="text-align: left; background: #1f1f1f; padding: 15px; border-radius: 12px;">
                    <strong style="color: #ffcb05; display: block; margin-bottom: 8px; font-size: 0.9em; letter-spacing: 1px;">HABILIDADES</strong>
                    <span style="text-transform: capitalize; font-size: 0.95em; line-height: 1.4;">
                        ${pokemon.abilities.join(', ').replace(/-/g, ' ')}
                    </span>
                </div>
            `;

            document.getElementById('modal-body').className = `modal-content border-${pokemon.types[0]}`;
            modal.style.display = "block";
        }

        function fecharModal() {
            document.getElementById('pokedexModal').style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('pokedexModal');
            if (event.target == modal) {
                fecharModal();
            }
        }

        function filtrarPokemons() {
            const termo = document.getElementById('search-input').value.toLowerCase();
            const filtrados = todosPokemons.filter(p => p.name.toLowerCase().includes(termo));
            exibirPokemons(filtrados);
        }

        carregarPokedex();
    </script>
</body>
</html>
